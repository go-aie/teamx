# Copy to config.toml in this directory and pass --config .teamx/config.toml.
# For installed use, copy this example and teams/ into ~/.teamx/.
# Relative paths below resolve from this file's directory; no shell expansion.
[server]
listen = "127.0.0.1:8088"
data_dir = "./data"
teams_dir = "./teams"
max_turns = 16
# Total time per DSH turn, including model and tools. Use "30m" for large tasks.
dsh_turn_timeout = "15m"
# merge_window = "100ms"

# Optional service limits for read-only GitLab image material preparation.
# Zero/omitted numbers use defaults. Total raw image bytes cannot exceed 4 MiB.
# [server.image_materials]
# scan_entries = 25 # Combined Room/Inbox entries, Room first; at most 100.
# max_images = 4 # At most 16; duplicates in this turn share one block.
# image_bytes = 2097152
# total_bytes = 4194304
# max_pixels = 16777216
# timeout = "30s" # At most 2m; individual failures retain missing-image status.

# Default runtime for teams that omit their own complete runtime.
[runtime.dsh]
binary_path = "/absolute/path/to/dsh"
# Development with Node: use its path above and set binary_args to the CLI JS.
# binary_args = ["/absolute/path/to/dsh/lib/bin.js"]

[runtime.model]
protocol = "openai-completions"
base_url = "https://model.example/v1"
model_id = "your-model"
api_key_env = "OPENAI_API_KEY"
# Optional: match these values to the actual model and gateway.
# reasoning_effort = "low"
# context_window = 1048576
# max_tokens = 32768
# Optional, only when this exact Completions model and gateway support images.
# ACP initialize must also advertise image input; otherwise the session fails.
# input_modalities = ["text", "image"]

# Optional Completions wire dialect for this exact model. Omit to keep defaults.
# Set false if the gateway accepts system but rejects developer message roles.
# [runtime.model.compat]
# supports_developer_role = false

# Existing service environment variables (even empty ones) take precedence.
# These values stay outside Room snapshots. Do not commit actual credentials.
[env]
OPENAI_API_KEY = ""
# Optional: otherwise resolve beside the TeamX executable, then on the server PATH.
# TEAMX_GITLAB_BIN = "/absolute/path/to/teamx-gitlab"
# TEAMX_GLAB_BIN = "/absolute/path/to/glab"
