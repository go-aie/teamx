# Copy to config.toml in this directory and pass --config .teamx/config.toml.
# For installed use, copy this example and teams/ into ~/.teamx/.
# Relative paths below resolve from this file's directory; no shell expansion.
[server]
listen = "127.0.0.1:8088"
# 在「设置 → 安全」选择仅本机、局域网或 HTTPS 代理；修改后重启生效。
# access_mode = "local" # local | lan | proxy
# LAN 模式要求登录，使用 0.0.0.0:<端口>，只接受本机私有 IP 和私有来源直连。
# HTTPS proxy mode requires login and one canonical HTTPS origin.
# public_base_url = "https://assistant.example.com"
# trusted_proxies = ["127.0.0.1"]
# Shared by all Rooms and page time displays. Settings can save this without restart.
time_zone = "Asia/Shanghai"
data_dir = "./data"
teams_dir = "./teams"
# DSH 每会话最多受理的回合数；下次有输入时自动轮换。正数，默认 16。
# 受管房间保存创建时阈值；修改默认值只影响新房间。旧 max_turns 已移除。
session_max_turns = 16
# Total time per DSH turn, including model and tools. Use "30m" for large tasks.
dsh_turn_timeout = "15m"
# merge_window = "100ms"

# Optional service limits for read-only GitLab image material preparation.
# Zero/omitted numbers use defaults. Total raw image bytes cannot exceed 4 MiB.
# [server.image_materials]
# scan_entries = 25 # Combined Room/Inbox entries, Room first; at most 100.
# max_images = 4 # At most 16; duplicates in this turn share one block.
# image_bytes = 2097152
# total_bytes = 4194304
# max_pixels = 16777216
# timeout = "30s" # At most 2m; individual failures retain missing-image status.

# teamx serve --home <directory> 首次准备固定操作者；默认本机免登录，随后在网页设置模型。
# access.login_enabled 由设置页面保存；旧安装省略时保持认证开启。
# 已有实例的 token 丢失时，才使用 access init 显式修复；操作者 ID 保持不变。

# DSH 安装入口；模型参数和 API Key 在启动后的网页中配置。
[runtime.dsh]
binary_path = "/absolute/path/to/dsh"
# 开发模式可改为 Node 路径，并指定完整 DSH 的 JS 入口。
# binary_args = ["/absolute/path/to/dsh/lib/bin.js"]

# 空列表表示首次设置；网页验证成功后保存列表及默认引用。
# 请勿手写 credential_ref，或将 API Key 放入此文件。
[models]
schema_version = 1
version = 0
default = ""
entries = []

# 非模型的服务环境配置。已有环境变量（包括空值）优先。
[env]
# TEAMX_GITLAB_BIN = "/absolute/path/to/teamx-gitlab"
# TEAMX_GLAB_BIN = "/absolute/path/to/glab"
