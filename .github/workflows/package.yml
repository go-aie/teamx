name: Package snapshots

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Development snapshot profile (Linux full remains blocked until its TLS runtime is bundled)
        type: choice
        options: [core, standard, full]
        default: standard

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      go_version: ${{ steps.plan.outputs.go_version }}
      node_version: ${{ steps.plan.outputs.node_version }}
      dependency_key: ${{ steps.plan.outputs.dependency_key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The hosted image's Node only reads the lock; checks/builds use its exact version below.
      - name: Read locked tools and complete delivery matrix
        id: plan
        env:
          SNAPSHOT_PROFILE: ${{ inputs.profile || 'standard' }}
        run: node scripts/package-ci.mjs plan "$SNAPSHOT_PROFILE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.plan.outputs.node_version }}
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.plan.outputs.go_version }}
          cache-dependency-path: go.sum
      - name: Check inventory and snapshot validation
        run: |
          node scripts/check-packaging.mjs
          node --test scripts/*.test.mjs
      - name: Core regression, vet and Web checks
        run: |
          make test
          go vet ./...
          node --test internal/room/web*_test.mjs

  package:
    needs: checks
    name: Build ${{ matrix.target }} ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ needs.checks.outputs.node_version }}
          package-manager-cache: false
      - name: Require native runner
        env:
          SNAPSHOT_TARGET: ${{ matrix.target }}
        run: node scripts/package-ci.mjs host "$SNAPSHOT_TARGET"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.checks.outputs.go_version }}
          cache-dependency-path: go.sum
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .packaging/cache
          key: package-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.profile }}-node${{ needs.checks.outputs.node_version }}-${{ needs.checks.outputs.dependency_key }}
          # No cross-target restore keys; package.sh rechecks archive hashes/npm integrity.
      - name: Build and smoke the final development archive
        env:
          SNAPSHOT_TARGET: ${{ matrix.target }}
          SNAPSHOT_PROFILE: ${{ matrix.profile }}
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          ./scripts/package.sh --channel dev --profile "$SNAPSHOT_PROFILE" --target "$SNAPSHOT_TARGET" --output-dir "$RUNNER_TEMP/snapshot"
          node scripts/package-ci.mjs record "$RUNNER_TEMP/snapshot" "$SNAPSHOT_TARGET" "$SNAPSHOT_PROFILE" "$GITHUB_SHA"
      # Upload sealed archives, never a staging directory (modes/hidden resources stay in tar).
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: snapshot-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/snapshot/*.tar.gz
            ${{ runner.temp }}/snapshot/*.tar.gz.sha256
            ${{ runner.temp }}/snapshot/*-report.json
            ${{ runner.temp }}/snapshot/snapshot.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify:
    needs: [checks, package]
    # Verify successful matrix artifacts even if another target failed; missing
    # artifacts still fail visibly. Never retrieve an artifact from an older run.
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    name: Download and verify ${{ matrix.target }} ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ needs.checks.outputs.node_version }}
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: snapshot-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded
      - name: Verify downloaded identity and run isolated archive smoke
        env:
          SNAPSHOT_TARGET: ${{ matrix.target }}
          SNAPSHOT_PROFILE: ${{ matrix.profile }}
        run: >-
          node scripts/package-ci.mjs verify "$RUNNER_TEMP/downloaded"
          "$SNAPSHOT_TARGET" "$SNAPSHOT_PROFILE" "$GITHUB_SHA"
          "$RUNNER_TEMP/download-report.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: snapshot-verification-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download-report.json
          if-no-files-found: error
          retention-days: 7
